<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Load Balancer Demo — Server 2</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #2f1b3e; color: #fff; }
    main { width: min(90%, 620px); padding: 48px; text-align: center; border: 1px solid #d38ce8; border-radius: 20px; background: #48265b; box-shadow: 0 18px 50px #1a0d22; }
    .badge { display: inline-block; padding: 7px 14px; border-radius: 999px; background: #ad58c2; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 22px 0 8px; font-size: clamp(2rem, 7vw, 4rem); }
    p { color: #f1d7fb; font-size: 1.1rem; }
    code { color: #ffc5ff; }
  </style>
</head>
<body>
  <main>
    <span class="badge">BACKEND SERVER 2</span>
    <h1>Hello from Node 2</h1>
    <p>Welcome to the Load Balancer 2 test.</p>
    <p>This purple page confirms that your load balancer reached <code>server-2</code>.</p>
  </main>
</body>
</html>
